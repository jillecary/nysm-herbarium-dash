name: Build and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 1 * *"   # 1st of every month, to refresh GBIF data
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: npm ci
      - run: pip install -r requirements.txt

      - name: Reuse the last GBIF download if it's recent
        uses: actions/cache@v4
        with:
          path: .gbif-cache
          key: gbif-${{ github.run_id }}
          restore-keys: gbif-

      - run: npm run build
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4